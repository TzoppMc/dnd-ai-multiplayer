<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room - DnD AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/dice.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/inventory.css">
</head>
<body>
    <div id="game-room" class="game-layout">
        <!-- Top Bar -->
        <header class="game-header">
            <div class="room-info">
                <span id="room-name-display"></span>
                <span id="room-code-display" class="room-code"></span>
            </div>
            <div class="game-controls">
                <button id="btn-leave-room" class="btn btn-danger">Leave</button>
                <button id="btn-settings" class="btn btn-icon">⚙️</button>
            </div>
        </header>

        <!-- Main Game Area -->
        <div class="game-main">
            <!-- Left Panel - Game Table & Map -->
            <section class="game-table">
                <div id="game-map-container" class="game-map">
                    <!-- Map akan dirender disini -->
                </div>
                <div id="dice-area" class="dice-roller-area">
                    <!-- Dice roller component -->
                </div>
                <div id="turn-indicator" class="turn-tracker">
                    <!-- Turn indicator -->
                </div>
            </section>

            <!-- Right Panel - Chat & Players -->
            <aside class="side-panel">
                <!-- Player List -->
                <div id="player-list-container" class="player-list">
                    <h3>Players</h3>
                    <div id="player-list"></div>
                </div>

                <!-- Chat Area -->
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages"></div>
                    
                    <!-- Emote Picker -->
                    <div id="emote-picker" class="emote-picker hidden"></div>
                    
                    <!-- Chat Input -->
                    <div class="chat-input-area">
                        <button id="btn-emote" class="btn-icon">😊</button>
                        <input type="text" id="chat-input" placeholder="Type message or /roll 2d20...">
                        <button id="btn-send" class="btn-icon">📤</button>
                        <button id="btn-voice" class="btn-icon">🎤</button>
                    </div>

                    <!-- Voice Chat Controls -->
                    <div id="voice-controls" class="voice-controls hidden">
                        <button id="btn-mute" class="btn-icon">🔇</button>
                        <div id="voice-participants"></div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Bottom Panel - Character & Inventory -->
        <footer class="game-footer">
            <button id="btn-character" class="btn btn-secondary">📋 Character Sheet</button>
            <button id="btn-inventory" class="btn btn-secondary">🎒 Inventory</button>
            <button id="btn-dice-roller" class="btn btn-primary">🎲 Roll Dice</button>
        </footer>

        <!-- Modals -->
        <div id="modal-character" class="modal hidden">
            <!-- Character sheet content -->
        </div>
        <div id="modal-inventory" class="modal hidden">
            <!-- Inventory content -->
        </div>
        <div id="modal-dice" class="modal hidden">
            <!-- Dice roller modal -->
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
